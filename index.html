<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            width: 90%;
            animation: popIn 1s ease-out;
        }

        /* Typography */
        h1 {
            color: #ff4081;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            animation: floatText 3s ease-in-out infinite;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .name {
            font-weight: bold;
            color: #9c27b0;
        }

        /* Cake Graphics (Pure CSS) */
        .cake-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
        }

        .cake {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 60px;
            background: #6d4c41;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 5px 0 #8d6e63;
        }

        .cake::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            width: 120px;
            height: 15px;
            background: #ff80ab;
        }

        .cake::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 10px;
            background: #fff;
            border-radius: 10px 10px 0 0;
        }

        /* Candle */
        .candle {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 35px;
            background: linear-gradient(to right, #e0e0e0, #f5f5f5);
            border-radius: 2px;
        }

        .candle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, #ff1744, #ff1744 4px, #fff 4px, #fff 8px);
        }

        /* Flame Animation */
        .flame {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 24px;
            background: #ffeb3b;
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 10px #ff9100, 0 0 20px #ff3d00;
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        /* Confetti Elements */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall infinite linear;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Confetti Background Elements -->
    <div class="confetti" style="left: 10%; background: #ff4081; animation-duration: 4s; animation-delay: 0s;"></div>
    <div class="confetti" style="left: 30%; background: #00e676; animation-duration: 5s; animation-delay: 1s;"></div>
    <div class="confetti" style="left: 50%; background: #29b6f6; animation-duration: 3s; animation-delay: 0.5s;"></div>
    <div class="confetti" style="left: 70%; background: #ffea00; animation-duration: 6s; animation-delay: 2s;"></div>
    <div class="confetti" style="left: 90%; background: #ab47bc; animation-duration: 4.5s; animation-delay: 1.5s;"></div>

    <!-- Main Birthday Card -->
    <div class="card">
        <div class="cake-container">
            <div class="flame"></div>
            <div class="candle"></div>
            <div class="cake"></div>
        </div>
        <h1>Happy Birthday!</h1>
        <p>Wishing you a wonderful day filled with joy, laughter, and lots of cake. May all your dreams come true this year, <span class="name">Friend</span>!</p>
    </div>

</body>
</html>
